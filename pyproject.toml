[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canslim-analysis"
version = "2.1.0"
description = "Hybrid quantitative and qualitative CANSLIM analysis pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT-0" }
authors = [{ name = "CANSLIM Analysis maintainers" }]
dependencies = [
    "requests>=2.31,<3",
    "yfinance>=0.2.28,<0.3",
    "reportlab>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
