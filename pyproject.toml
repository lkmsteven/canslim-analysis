[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canslim-analysis"
version = "2.1.0"
description = "Hybrid quantitative and qualitative CANSLIM analysis pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT-0" }
authors = [{ name = "CANSLIM Analysis maintainers" }]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
