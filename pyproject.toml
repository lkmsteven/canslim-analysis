[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canslim-analysis"
version = "2.1.0"
description = "Hybrid quantitative and qualitative CANSLIM analysis pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT-0" }
authors = [{ name = "CANSLIM Analysis maintainers" }]
dependencies = [
    # HTTP retrieval for the S&P 500 universe provider.
    "requests==2.34.2",
    # Market fundamentals and price history.
    "yfinance==0.2.66",
    # Pinned because newer NumPy wheels require CPU instructions unavailable on the verified host.
    "numpy==2.2.6",
    # Canonical final-report PDF rendering.
    "reportlab==4.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
